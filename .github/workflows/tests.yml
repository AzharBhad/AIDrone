name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests + fast end-to-end missions
        run: pytest -q
      - name: Full all-weather scenario matrix
        run: pytest -q --runslow tests/test_scenarios.py
